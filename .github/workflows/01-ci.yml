name: 01 - CI

on:
  # Trigger the workflow on push to main branch
  # (merging a pull request into main is a push to main)
  push:
    branches:
      - main

  # Run the tests on every pull request into main, so changes are
  # validated before they are merged and deployed (Task 9.3C)
  pull_request:
    branches:
      - main

  # Manual trigger for the workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =========================================================
  # Stage 1: Backend Tests
  # =========================================================
  backend-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: user-service
            database: users
            port: 5433

          - service: student-service
            database: students
            port: 5434

          - service: lecturer-service
            database: lecturers
            port: 5435

          - service: course-service
            database: courses
            port: 5436

          - service: enrollment-service
            database: enrollments
            port: 5437

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}

        ports:
          - ${{ matrix.port }}:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d ${{ matrix.database }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${{ matrix.database }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${{ matrix.port }}

      JWT_SECRET_KEY: koalatech-ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_EMAIL: admin@koalatech.edu.au
      DEFAULT_ADMIN_PASSWORD: AdminPassword123!

      AZURE_STORAGE_CONNECTION_STRING: ""
      AZURE_STORAGE_CONTAINER_NAME: ""

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          pytest -v


  # =========================================================
  # Stage 2: Build, Security Scan (Docker Scout) and Push
  # Images are scanned BEFORE they are pushed to ACR, so an
  # image with fixable critical/high CVEs never reaches the
  # registry or the cluster.
  # =========================================================
  build-scan-push:
    name: Build, scan and push ${{ matrix.image }}
    runs-on: ubuntu-latest

    # All backend tests must pass. The Azure infrastructure (AKS, ACR,
    # storage) is already provisioned, so the Terraform stage was removed
    # for Task 9.3C, which focuses on the deployment stages.
    needs:
      - backend-test

    # Build and push when code is pushed to main or manually triggered
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: frontend
            image: koalatech-frontend

          - service: user-service
            image: koalatech-user-service

          - service: student-service
            image: koalatech-student-service

          - service: lecturer-service
            image: koalatech-lecturer-service

          - service: course-service
            image: koalatech-course-service

          - service: enrollment-service
            image: koalatech-enrollment-service

    env:
      IMAGE_REF: ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      # Docker Scout requires a Docker Hub account
      - name: Login to Docker Hub (for Docker Scout)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_REF }}

      - name: Docker Scout - vulnerability report (all severities)
        uses: docker/scout-action@v1
        with:
          command: quickview,cves
          image: local://${{ env.IMAGE_REF }}
          sarif-file: scout-${{ matrix.service }}.sarif
          summary: true
          exit-code: false

      - name: Docker Scout - base image recommendations
        uses: docker/scout-action@v1
        with:
          command: recommendations
          image: local://${{ env.IMAGE_REF }}
          summary: true

      - name: Upload Docker Scout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-scout-${{ matrix.service }}
          path: scout-${{ matrix.service }}.sarif
          if-no-files-found: ignore

      # Security gate: fail the build if the image contains
      # critical/high vulnerabilities that already have a fix.
      - name: Docker Scout - security gate
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://${{ env.IMAGE_REF }}
          only-severities: ${{ vars.SCOUT_FAIL_SEVERITIES || 'critical,high' }}
          only-fixed: true
          summary: false
          exit-code: true

      # Only reached when the gate passes. Rebuilds from the build
      # cache and pushes with an SBOM and provenance attestation
      # (supply-chain policy finding from Task 10.1P).
      - name: Push image with SBOM and provenance
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.IMAGE_REF }}
