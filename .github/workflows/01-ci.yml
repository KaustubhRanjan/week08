name: 01 - CI

on:
  # Trigger the workflow on push to main branch
  push:
    branches:
      - main

  # Manual trigger for the workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =========================================================
  # Stage 1: Infrastructure as Code (Terraform)
  # Provisions / reconciles the resource group, ACR, AKS and
  # storage account BEFORE any image is built or deployed.
  # =========================================================
  terraform:
    name: Terraform (fmt, validate, plan, apply)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export Azure service principal for Terraform
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          CLIENT_SECRET=$(jq -r '.clientSecret' <<< "$AZURE_CREDENTIALS")
          echo "::add-mask::$CLIENT_SECRET"
          {
            echo "ARM_CLIENT_ID=$(jq -r '.clientId' <<< "$AZURE_CREDENTIALS")"
            echo "ARM_CLIENT_SECRET=$CLIENT_SECRET"
            echo "ARM_SUBSCRIPTION_ID=$(jq -r '.subscriptionId' <<< "$AZURE_CREDENTIALS")"
            echo "ARM_TENANT_ID=$(jq -r '.tenantId' <<< "$AZURE_CREDENTIALS")"
          } >> "$GITHUB_ENV"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Create the Terraform state storage account on first run
      # (idempotent - does nothing if it already exists).
      - name: Bootstrap Terraform state storage
        run: |
          RG="${{ vars.TFSTATE_RESOURCE_GROUP }}"
          SA="${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          if ! az storage account show --name "$SA" --resource-group "$RG" >/dev/null 2>&1; then
            az storage account create \
              --name "$SA" \
              --resource-group "$RG" \
              --location "$(az group show --name "$RG" --query location -o tsv)" \
              --sku Standard_LRS \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access false
          fi
          KEY=$(az storage account keys list --account-name "$SA" --resource-group "$RG" --query "[0].value" -o tsv)
          echo "::add-mask::$KEY"
          az storage container create --name tfstate --account-name "$SA" --account-key "$KEY" --output none

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (remote state in Azure Storage)
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=week08.terraform.tfstate"

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: |
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
          {
            echo "## Terraform plan"
            echo '```'
            grep -E "^(Plan:|No changes)" plan.txt || tail -n 5 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform outputs
        if: github.ref == 'refs/heads/main'
        run: |
          {
            echo "## Terraform outputs"
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


  # =========================================================
  # Stage 2: Backend Tests
  # =========================================================
  backend-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: user-service
            database: users
            port: 5433

          - service: student-service
            database: students
            port: 5434

          - service: lecturer-service
            database: lecturers
            port: 5435

          - service: course-service
            database: courses
            port: 5436

          - service: enrollment-service
            database: enrollments
            port: 5437

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}

        ports:
          - ${{ matrix.port }}:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d ${{ matrix.database }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${{ matrix.database }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${{ matrix.port }}

      JWT_SECRET_KEY: koalatech-ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_EMAIL: admin@koalatech.edu.au
      DEFAULT_ADMIN_PASSWORD: AdminPassword123!

      AZURE_STORAGE_CONNECTION_STRING: ""
      AZURE_STORAGE_CONTAINER_NAME: ""

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          pytest -v


  # =========================================================
  # Stage 3: Build, Security Scan (Docker Scout) and Push
  # Images are scanned BEFORE they are pushed to ACR, so an
  # image with fixable critical/high CVEs never reaches the
  # registry or the cluster.
  # =========================================================
  build-scan-push:
    name: Build, scan and push ${{ matrix.image }}
    runs-on: ubuntu-latest

    # Infrastructure must exist and all backend tests must pass
    needs:
      - terraform
      - backend-test

    # Build and push when code is pushed to main or manually triggered
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: frontend
            image: koalatech-frontend

          - service: user-service
            image: koalatech-user-service

          - service: student-service
            image: koalatech-student-service

          - service: lecturer-service
            image: koalatech-lecturer-service

          - service: course-service
            image: koalatech-course-service

          - service: enrollment-service
            image: koalatech-enrollment-service

    env:
      IMAGE_REF: ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      # Docker Scout requires a Docker Hub account
      - name: Login to Docker Hub (for Docker Scout)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_REF }}

      - name: Docker Scout - vulnerability report (all severities)
        uses: docker/scout-action@v1
        with:
          command: quickview,cves
          image: local://${{ env.IMAGE_REF }}
          sarif-file: scout-${{ matrix.service }}.sarif
          summary: true
          exit-code: false

      - name: Docker Scout - base image recommendations
        uses: docker/scout-action@v1
        with:
          command: recommendations
          image: local://${{ env.IMAGE_REF }}
          summary: true

      - name: Upload Docker Scout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-scout-${{ matrix.service }}
          path: scout-${{ matrix.service }}.sarif
          if-no-files-found: ignore

      # Security gate: fail the build if the image contains
      # critical/high vulnerabilities that already have a fix.
      - name: Docker Scout - security gate
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://${{ env.IMAGE_REF }}
          only-severities: ${{ vars.SCOUT_FAIL_SEVERITIES || 'critical,high' }}
          only-fixed: true
          summary: false
          exit-code: true

      # Only reached when the gate passes. Rebuilds from the build
      # cache and pushes with an SBOM and provenance attestation
      # (supply-chain policy finding from Task 10.1P).
      - name: Push image with SBOM and provenance
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.IMAGE_REF }}
